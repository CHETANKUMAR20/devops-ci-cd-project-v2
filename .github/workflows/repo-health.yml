name: Repository Health Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Display Commit Information
        run: |
          echo "Commit SHA: $GITHUB_SHA"
          echo "Commit message:"
          git log -1 --pretty=%B

      - name: Repository Health Status
        run: echo "Repository validation completed successfully."
